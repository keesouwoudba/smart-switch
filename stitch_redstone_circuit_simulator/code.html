<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Circuit Sim V1 - Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Skeuomorphic Utility Classes */
        .plate-stone {
            background-color: #c7c6c6; /* tertiary */
            border: 2px solid #919191; /* tertiary-container */
            border-bottom-width: 4px;
            border-right-width: 4px;
        }
        .plate-stone:active {
            border-bottom-width: 2px;
            border-right-width: 2px;
            transform: translate(2px, 2px);
        }
        
        .lamp-off {
            background-color: #0e0e0e; /* surface-container-lowest */
            border: 2px solid #353535; /* surface-variant */
            background-image: repeating-linear-gradient(45deg, #131313 25%, transparent 25%, transparent 75%, #131313 75%, #131313), repeating-linear-gradient(45deg, #131313 25%, #0e0e0e 25%, #0e0e0e 75%, #131313 75%, #131313);
            background-position: 0 0, 4px 4px;
            background-size: 8px 8px;
        }

        .brick-border {
            border: 8px solid #353535;
            box-shadow: inset 4px 4px 0px 0px rgba(255,255,255,0.1), inset -4px -4px 0px 0px rgba(0,0,0,0.5);
        }
    
        .pressure-plate-wood {
            background-color: #8B5A2B;
            border: 4px solid #5D3A1A;
            border-bottom-width: 8px;
            box-shadow: inset 4px 4px 0px 0px rgba(255,255,255,0.2);
            color: #ffdad4;
            transition: all 0.1s;
        }
        .pressure-plate-wood:active {
            border-bottom-width: 2px;
            transform: translateY(6px);
            box-shadow: inset 2px 2px 0px 0px rgba(0,0,0,0.5);
        }
        .pressure-plate-stone {
            background-color: #7D7D7D;
            border: 4px solid #4A4A4A;
            border-bottom-width: 8px;
            box-shadow: inset 4px 4px 0px 0px rgba(255,255,255,0.2);
            color: #e5e2e1;
            transition: all 0.1s;
        }
        .pressure-plate-stone:active {
            border-bottom-width: 2px;
            transform: translateY(6px);
            box-shadow: inset 2px 2px 0px 0px rgba(0,0,0,0.5);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#690005",
                        "secondary-fixed": "#83fba5",
                        "on-tertiary-container": "#292a2a",
                        "secondary-fixed-dim": "#66dd8b",
                        "primary": "#ffb4a8",
                        "surface-dim": "#131313",
                        "on-surface-variant": "#ebbbb4",
                        "on-secondary-fixed": "#00210c",
                        "on-primary-fixed-variant": "#930100",
                        "tertiary-fixed": "#e3e2e2",
                        "background": "#131313",
                        "surface-container": "#20201f",
                        "on-tertiary": "#2f3031",
                        "outline": "#b18780",
                        "primary-fixed": "#ffdad4",
                        "secondary": "#66dd8b",
                        "primary-container": "#ff5540",
                        "on-tertiary-fixed-variant": "#464747",
                        "on-background": "#e5e2e1",
                        "on-secondary": "#003919",
                        "surface-container-lowest": "#0e0e0e",
                        "on-primary": "#690100",
                        "surface-bright": "#393939",
                        "surface-container-highest": "#353535",
                        "on-tertiary-fixed": "#1b1c1c",
                        "secondary-container": "#25a55a",
                        "tertiary-container": "#919191",
                        "on-error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#c7c6c6",
                        "tertiary": "#c7c6c6",
                        "on-primary-fixed": "#410000",
                        "on-secondary-container": "#003115",
                        "surface-container-high": "#2a2a2a",
                        "error-container": "#93000a",
                        "surface-tint": "#ffb4a8",
                        "surface-container-low": "#1c1b1b",
                        "on-surface": "#e5e2e1",
                        "error": "#ffb4ab",
                        "inverse-primary": "#c00100",
                        "primary-fixed-dim": "#ffb4a8",
                        "on-primary-container": "#5c0000",
                        "outline-variant": "#603e39",
                        "on-secondary-fixed-variant": "#005227",
                        "surface-variant": "#353535",
                        "surface": "#131313",
                        "inverse-on-surface": "#313030",
                        "inverse-surface": "#e5e2e1"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding": "24px",
                        "viewport-margin": "32px",
                        "block-unit": "4px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Space Grotesk"],
                        "headline-md": ["Space Grotesk"],
                        "label-pixel": ["Space Grotesk"],
                        "body-reg": ["Space Grotesk"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "label-pixel": ["12px", { "lineHeight": "1", "fontWeight": "700" }],
                        "body-reg": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen overflow-hidden flex flex-col font-body-reg">
<!-- TopAppBar -->
<header class="bg-[#131313] font-['Space_Grotesk'] uppercase tracking-tighter docked full-width top-0 border-b-4 border-stone-900 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] flex justify-between items-center px-4 h-16 w-full z-50 fixed">
<div class="flex items-center gap-6">
<span class="text-2xl font-bold text-stone-200 border-b-4 border-inverse-primary pb-1">CIRCUIT_SIM_V1</span>
<div class="flex gap-2 items-center">
<span class="font-label-pixel text-secondary bg-[#0a0a0a] px-3 py-1 border-2 border-stone-800 tracking-widest shadow-[inset_0_0_8px_rgba(102,221,139,0.2)]">SYSTEM_STATUS: STANDBY</span>
</div>
</div>
<div class="flex items-center gap-4">
<button class="text-stone-400 hover:text-white hover:bg-stone-800 transition-colors p-2">
<span class="material-symbols-outlined">settings</span>
</button>
<button class="text-stone-400 hover:text-white hover:bg-stone-800 transition-colors p-2">
<span class="material-symbols-outlined">help</span>
</button>
<div class="w-8 h-8 bg-surface-variant border-2 border-outline flex items-center justify-center overflow-hidden">
<img alt="Engineer Avatar" class="w-full h-full object-cover" data-alt="A low-resolution pixel art style portrait of an engineer character, featuring a rugged face with goggles resting on the forehead. The portrait is rendered in a limited palette of earth tones and grays, emphasizing a retro gaming aesthetic. High-contrast blocky shading defines the facial features against a dark, solid background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDm0VgOmV3fXDpre6CR4KOKZe_uF-KeEQJpGQjI5oZprzmsMb9LN18hlsJkuyIe2tSCogHsvCu7xpSd70UBDUtv95Lk-cjNIGuH-1hKrzq6Xku-1wCTukl5w3kzdCgou10vKIqXbZHDktJstmwtiQNQUNPTenM_4LYTqpc3DVY0ItbQW3EuZlmFJfKUV2m0Nuux4NG-4ts8iCVAIarXEcUu6uD0IIelyEXbxi5tKbO1mvugvIMpYoIV-kJ3UDlvnE0ySv-zECJMtqE"/>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="grow flex pt-16 h-screen">
<!-- Viewport Canvas -->
<div class="grow p-viewport-margin flex flex-col gap-gutter overflow-y-auto bg-surface-dim mr-90">
<div class="flex items-center justify-end mb-4">
<div class="flex gap-2">
<span class="font-label-pixel text-secondary bg-on-secondary px-3 py-1.5 border-2 border-secondary-container">DAY/NIGHT CYCLE: SYNCED</span>
</div>
</div>
<!-- Central Video Viewport -->
<div class="w-full max-w-6xl mx-auto aspect-video bg-surface-container-lowest brick-border relative flex items-center justify-center overflow-hidden">
<div class="absolute inset-0 bg-cover bg-center" data-alt="A daytime view of a blocky, voxel-based architectural structure resembling a small wooden house with a stone foundation. The scene is rendered in a classic 8-bit retro gaming style with sharp pixel edges and flat textures. A pixelated humanoid character stands motionless near the entrance. The lighting mimics a bright, overhead sun, casting harsh, blocky shadows across the grassy terrain." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBszM2YxAhqejSnC6udjeqpZlSTlFf5GOIhVnkHitF_lC-Lbqo896XZrWT7B54w3XDOJx6Ab2Aku-f0Zj5Hi_sGA4F-tXHJ-mIUbYi19vGbwPg2fPHWIYjCxLXY8X8k8i-SJxgjCdG3s4kADcspeCxQULsFlJdep8_bd_yRBjIPt4To0qZRK4Q2dznCZZJEVScyXl2IoYN38Fqf4LmEt6LigwVISIZ5B62RufXnNI_qCckScqmxrkssrNVV4CLQtzkttCWxB1QQigw');"></div>
<!-- Crosshair overlay -->
<div class="absolute inset-0 pointer-events-none flex items-center justify-center">
<div class="w-4 h-0.5 bg-white/50"></div>
<div class="h-4 w-0.5 bg-white/50 absolute"></div>
</div>
<!-- Viewport Overlay Info -->
<div class="absolute top-4 left-4 font-label-pixel text-white bg-black/50 px-2 py-1 border border-white/20">
                CAM_01 [STANDBY]
            </div>
</div>
</div>
</main>
<!-- SideNavBar -->
<nav class="bg-[#1a1a1a] text-stone-200 font-['Space_Grotesk'] text-xs font-bold uppercase fixed right-0 h-full w-90 border-l-4 border-stone-900 shadow-[-4px_0px_0px_0px_rgba(0,0,0,1)] flex flex-col pt-16 z-40">
<!-- Header -->
<div class="p-5 border-b-4 border-stone-900 bg-[#131313]">
<h2 class="text-xl text-stone-100 font-headline-md tracking-tight">CONTROL_UNIT</h2>
<p class="text-stone-400 font-label-pixel mt-1">OBSIDIAN_CORE</p>
</div>
<!-- Controls Container -->
<div class="grow overflow-y-auto flex flex-col p-5 gap-8">
<!-- Logic Properties Panel -->
<div class="flex flex-col gap-4">
<button class="flex items-center justify-between bg-surface-container-low p-4 border-2 border-surface-variant hover:border-outline hover:bg-surface-container transition-all group text-left w-full">
<span class="font-label-pixel text-on-surface uppercase group-hover:text-white transition-colors">Light Switch</span>
<div class="w-10 h-10 lamp-off rounded-none shadow-[inset_2px_2px_0px_0px_rgba(0,0,0,0.5)] shrink-0"></div>
</button>
<button class="flex items-center justify-between bg-surface-container-low p-4 border-2 border-surface-variant hover:border-outline hover:bg-surface-container transition-all group text-left w-full">
<span class="font-label-pixel text-on-surface uppercase group-hover:text-white transition-colors">Energy Saving Mode</span>
<div class="w-10 h-10 lamp-off rounded-none shadow-[inset_2px_2px_0px_0px_rgba(0,0,0,0.5)] shrink-0"></div>
</button>
</div>
<!-- Sensor Triggers Panel -->
<div class="flex flex-col gap-4">
<h3 class="font-headline-md text-outline uppercase border-b-2 border-surface-variant pb-2 text-[16px] tracking-wide">Sensor Triggers</h3>
<div class="grid grid-cols-2 gap-6">
<button class="pressure-plate-wood flex items-center justify-center w-full py-6 px-4 font-headline-md text-[18px] tracking-widest uppercase">
    ENTER ROOM
</button>
<button class="pressure-plate-stone flex items-center justify-center w-full py-6 px-4 font-headline-md text-[18px] tracking-widest uppercase">
    EXIT ROOM
</button>
</div>
</div>
</div>
<!-- Footer / CTA -->
<div class="p-5 border-t-4 border-stone-900 bg-[#131313] flex flex-col gap-3">
</div>
</nav>
</body></html>
